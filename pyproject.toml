[project]
name = "hidguard"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "evdev>=1.9.3",
    "pydantic>=2.13.4",
    "pyudev>=0.24.4",
    "rich>=14.0.0",
]

[dependency-groups]
dev = [
    "interrogate>=1.7.0",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
    "ty>=0.0.69",
]

[project.scripts]
hidguard = "hidguard.cli:main_cli"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.mypy]
# pyudev ships no py.typed marker, so its imports are untyped by necessity.
[[tool.mypy.overrides]]
module = ["pyudev.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
markers = [
    "integration: requires /dev/uinput access, run explicitly",
]
